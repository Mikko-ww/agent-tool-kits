[project]
name = "atkits"
version = "0.1.0"
description = "Distribute agent skills / plugins from one vault onto many agent platforms (Claude Code, Codex, Cursor, OpenCode, pi, ...)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "semver>=3",
    "packaging>=24",
    "filelock>=3.16",
]

[project.scripts]
atkits = "atkits.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atkits"]

[tool.hatch.build.targets.wheel.force-include]
"src/atkits/platform_registry.json" = "atkits/platform_registry.json"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
